name: Deploy Pages

on:
  push:
    branches: [main, polish-20261030]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 只发布前端成品，不传模型和存档
        run: |
          mkdir -p _site
          cp index.html _site/
          cp "Altiora-未来的我.html" _site/
          cp "Altiora-给老师看.html" _site/
          cp avatar-preview.html _site/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
